name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    name: Packaging — dependency source of truth + installable wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # services/api/pyproject.toml is authoritative; every requirements*.txt is
      # generated from it. Before this gate the two had silently diverged (pyproject
      # pinned fastapi 0.139.2 / uvicorn 0.37.0 / pydantic-settings 2.6.1 while
      # requirements.txt pinned 0.140.0 / 0.51.0 / 2.14.2), so Docker+CI and the
      # published wheel resolved different dependency sets and a green run proved
      # nothing about either.
      - name: Dependency files match pyproject.toml
        run: python scripts/sync_dependencies.py --check

      # A wheel that imports only because the repo is on sys.path is not a wheel.
      # Build it, install into a clean venv with no source checkout on the path, and
      # boot the real app from site-packages.
      - name: Build the API wheel
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install the wheel into a clean environment and boot it
        working-directory: services/api
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --upgrade pip
          /tmp/wheel-env/bin/pip install dist/*.whl
          # cd out of the source tree so a missing packaged file cannot be masked by
          # the local checkout — which is exactly how the missing prompt assets went
          # unnoticed: app/llm/prompts/*.md are read from disk at runtime and were
          # absent from the wheel, so every structured-intelligence call raised
          # PromptNotFoundError in a wheel deployment while passing from a checkout.
          cd /tmp
          MEMORYOPS_STORAGE=memory /tmp/wheel-env/bin/python - <<'PY'
          import app.main  # noqa: F401
          from app.llm.prompt_registry import available_tasks, get_prompt

          for task in available_tasks():
              assert get_prompt(task).strip(), f"empty prompt asset: {task}"
          print("wheel import ok; prompt assets loaded:", available_tasks())
          PY

      # The provider adapters import their SDKs lazily, so a missing SDK shows up only
      # at call time (as a silent stub degradation). Prove each advertised extra
      # actually resolves and exposes the module its adapter imports.
      - name: Optional extras resolve to the modules the adapters import
        working-directory: services/api
        run: |
          set -euo pipefail
          # extra:module — module names must match the adapter imports exactly.
          for pair in "openai:openai" \
                      "anthropic:anthropic" \
                      "gemini:google.generativeai" \
                      "qdrant:qdrant_client" \
                      "lancedb:lancedb" \
                      "weaviate:weaviate"; do
            extra="${pair%%:*}"; module="${pair##*:}"
            echo "::group::extra '$extra' -> module '$module'"
            python -m venv "/tmp/extra-$extra"
            "/tmp/extra-$extra/bin/pip" install --quiet --upgrade pip
            "/tmp/extra-$extra/bin/pip" install --quiet ".[$extra]"
            "/tmp/extra-$extra/bin/python" -c "import importlib; importlib.import_module('$module'); print('$extra ok')"
            rm -rf "/tmp/extra-$extra"
            echo "::endgroup::"
          done

  api:
    name: API — tests + lint + evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dev deps
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: services/api
        run: ruff check app

      - name: Unit tests
        working-directory: services/api
        env:
          MEMORYOPS_STORAGE: memory
        run: pytest -q

      - name: Eval harness (invariants)
        env:
          MEMORYOPS_STORAGE: memory
        run: python evals/run_evals.py

  api-postgres:
    name: API — full suite + evals + benchmark + enforced RLS on Postgres + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memoryops
          POSTGRES_PASSWORD: memoryops
          POSTGRES_DB: memoryops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memoryops"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEMORYOPS_STORAGE: postgres
      DATABASE_URL: postgresql+psycopg://memoryops:memoryops@localhost:5432/memoryops
      PGPASSWORD: memoryops
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dev deps (+ Postgres extras)
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-postgres.txt

      - name: Apply migrations
        run: |
          for f in infra/db/migrations/*.sql; do
            echo "-- applying $f"
            psql -h localhost -U memoryops -d memoryops -v ON_ERROR_STOP=1 -f "$f"
          done

      # The full application suite exercises the real Postgres + pgvector write/read
      # path (chat, memory, audit, loops). The RLS tests additionally provision a
      # NON-superuser role and prove FORCEd row-level security blocks cross-tenant
      # reads at the database layer — meaningful only on real Postgres, since
      # superusers (the image's default role) bypass RLS.
      - name: Full test suite on Postgres (incl. enforced RLS)
        working-directory: services/api
        run: pytest -q

      - name: Verify RLS policies are FORCEd on every tenant-scoped table
        run: python scripts/check_rls_policies.py

      # Evals + benchmark honor MEMORYOPS_STORAGE, so these run the governance cases
      # against the real backend (each case truncates for a fresh stack).
      - name: Eval harness on Postgres
        run: python evals/run_evals.py

      - name: Governance benchmark on Postgres
        run: python benchmark/run_benchmark.py

  # The memory-governance benchmark also runs in its own workflow (benchmark.yml) on
  # the in-memory backend for a dedicated status badge; the api-postgres job above
  # additionally proves it passes against the real Postgres + pgvector stack.

  worker:
    name: Worker — packaged entrypoint + graceful shutdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The worker used to reach the API by inserting ../api into sys.path at import
      # time. It now depends on the built memoryops-api distribution, so this install
      # is the real proof there is no repository-layout coupling left.
      - name: Install the API and worker as distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./services/api
          python -m pip install --no-deps ./services/worker

      # Checks *code*, not prose. A plain grep also matched the docstring that
      # explains the removal ("previously mutated ``sys.path`` …"), failing the job
      # for describing the fix. Tokenising drops strings and comments so only real
      # manipulation trips it.
      - name: No sys.path manipulation in the worker entrypoint
        run: |
          python - <<'PY'
          import io, sys, tokenize

          path = "services/worker/main.py"
          with open(path, "rb") as fh:
              tokens = list(tokenize.tokenize(fh.readline))
          code = "".join(
              t.string for t in tokens
              if t.type not in (tokenize.STRING, tokenize.COMMENT)
          )
          offenders = [n for n in ("sys.path", "PYTHONPATH") if n in code]
          if offenders:
              print(f"::error::worker entrypoint still manipulates {offenders}")
              sys.exit(1)
          print("worker entrypoint is import-clean (code, excluding docs/comments)")
          PY

      # Boot the console script, let it complete a tick, then SIGTERM it mid-interval.
      # Before graceful shutdown landed, run_forever sat in an uninterruptible
      # time.sleep, so SIGTERM did nothing until the orchestrator's SIGKILL and the
      # held lease stayed locked for the rest of its TTL.
      - name: SIGTERM stops the worker cleanly (exit 0)
        env:
          MEMORYOPS_STORAGE: memory
          MEMORYOPS_WORKER_SCOPES: "t1:u1"
          MEMORYOPS_WORKER_INTERVAL_SECONDS: "30"
        run: |
          set -euo pipefail
          memoryops-worker > worker.log 2>&1 &
          WPID=$!
          sleep 5
          kill -TERM "$WPID"
          # Must exit well inside the 30s interval, not wait it out.
          for _ in $(seq 1 15); do
            kill -0 "$WPID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$WPID" 2>/dev/null; then
            echo "::error::worker ignored SIGTERM"
            kill -9 "$WPID"; cat worker.log; exit 1
          fi
          wait "$WPID"; RC=$?
          cat worker.log
          test "$RC" -eq 0 || { echo "::error::unclean exit $RC"; exit 1; }
          grep -q worker_shutdown_requested worker.log
          grep -q worker_stopped worker.log
          echo "worker shut down gracefully"

  sdk:
    name: SDK — tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SDK declares requires-python >=3.10; test every supported minor.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps (API for the in-process e2e fixture + SDK)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt
          python -m pip install pytest httpx
          python -m pip install -e packages/memoryops-sdk

      - name: SDK tests
        working-directory: packages/memoryops-sdk
        env:
          MEMORYOPS_STORAGE: memory
          PYTHONPATH: ${{ github.workspace }}/services/api
        run: pytest -q

  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        # Strict: fail if package-lock.json is out of sync rather than silently
        # regenerating it (the old `|| npm install` fallback masked lockfile drift).
        run: npm ci

      - name: Build
        working-directory: apps/web
        run: npm run build

  perf-smoke:
    name: Perf — HTTP load smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dev deps
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Boots the real app (in-memory, stub providers, rate-limit off) and drives a
      # small concurrency sweep. --max-error-rate 0 makes this a zero-tolerance
      # regression gate: a single unexpected HTTP 500 fails it. (At 60 requests the
      # old 0.02 threshold silently tolerated one failure — ~1.67% < 2%.) e.g. the
      # multi-memory write 500 (PR #42) showed as a ~40% error rate and fails here.
      # Keeps benchmark/perf/run_perf.py runnable.
      - name: Boot API + run load harness
        working-directory: services/api
        env:
          MEMORYOPS_STORAGE: memory
          MEMORYOPS_EMBEDDING_PROVIDER: stub
          MEMORYOPS_LLM_PROVIDER: stub
          MEMORYOPS_RATE_LIMIT_ENABLED: "false"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8099 --log-level warning &
          SRV=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8099/healthz >/dev/null && break || sleep 1
          done
          python ../../benchmark/perf/run_perf.py \
            --base-url http://127.0.0.1:8099 \
            --requests 60 --concurrency 1,5,10 --operations write,retrieval,chat \
            --repetitions 2 --seed-per-scenario 10 --warmup 10 \
            --max-error-rate 0 --out ../../perf-smoke.json
          RC=$?
          kill $SRV 2>/dev/null || true
          exit $RC

      - name: Upload perf-smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke
          path: perf-smoke.json
          if-no-files-found: ignore
